<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}InvoiceTracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('invoices.list_invoices') }}">InvoiceTracker</a>
    {% if g.user %}
    <nav>
      <a href="{{ url_for('invoices.list_invoices') }}">Invoices</a>
      <a href="{{ url_for('clients.list_clients') }}">Clients</a>
      <a href="{{ url_for('auth.logout') }}">Log out ({{ g.user['username'] }})</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}
    <p class="flash">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
